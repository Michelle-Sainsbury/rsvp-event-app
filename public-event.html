<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP | Community Tech Night</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="public.css">
</head>
<body>

<div class="guest-brand-bar">
  <a href="landing.html" class="wordmark">RSVP</a>
</div>

<div class="guest-main">

  <div class="guest-hero placeholder-art" id="guestHero">
    <div class="guest-hero-overlay"></div>
    <div class="guest-hero-title">
      <div class="guest-hero-eyebrow" id="guestHeroLocation">Brooklyn, NY</div>
      <h1 id="guestHeroName">Community Tech Night</h1>
    </div>
  </div>

  <div id="live-registration">
    <main id="app" class="guest-columns">
      <div id="appInfo"></div>
      <div id="appForm"></div>
    </main>
  </div>

</div>

<script src="events.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
<script>
  (function () {
    const eventId = new URLSearchParams(window.location.search).get("event") || "community-tech-night";
    const event = typeof getEventById === "function" ? getEventById(eventId) : null;
    if (!event) return;

    document.title = `RSVP | ${event.name}`;
    document.getElementById("guestHeroName").textContent = event.name;
    document.getElementById("guestHeroLocation").textContent = event.location;

    const hero = document.getElementById("guestHero");
    if (event.artClass) hero.classList.add(event.artClass);
    if (event.coverImage) {
      hero.style.backgroundImage = `url("${event.coverImage}")`;
      hero.style.backgroundSize = "cover";
      hero.style.backgroundPosition = "center";
    }
  })();
</script>
</body>
</html>
